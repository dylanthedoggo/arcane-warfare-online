<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkers Arcane Warfare</title>
<link rel="stylesheet" href="styles.css">
<!-- After styles.css, so its idle loops can override the static piece styling
     they animate. See fx.css. -->
<link rel="stylesheet" href="fx.css">
</head>
<body>

<div id="app">
  <div id="topbar">
    <div id="title">Checkers <b>Arcane Warfare</b></div>
    <div id="turnbadge"><span class="dot"></span><span class="nm">—</span></div>
    <div id="phasechip">—</div>
    <div id="devchip" hidden title="Dev sandbox: unlimited actions, every spell in hand, free transformations, endless Focus. Not a real game.">Dev Sandbox</div>
    <div id="topspacer"></div>
    <button class="tbtn" id="btnFx" title="Animation detail">FX</button>
    <button class="tbtn" id="btnRules">Rules</button>
    <button class="tbtn" id="btnUndo">Request Undo</button>
    <button class="tbtn" id="btnResign">Resign</button>
    <button class="tbtn" id="btnNew">New Game</button>
  </div>

  <!-- #fxlayer sits over the board and never takes a click. Everything the
       effect player draws lives in it; see fx.js. -->
  <div id="boardwrap"><div id="boardstack"><div id="board"></div><div id="fxlayer"></div></div></div>

  <div id="handcol">
    <div class="sect">
      <h3><span id="handowner">Your Hand</span> · <span id="handcount">0</span></h3>
      <div id="hand"></div>
    </div>
    <div id="handfoot">Spell pool: <b id="deckcount">weighted</b>.</div>
  </div>

  <div id="side">
    <div class="sect">
      <h3>Players</h3>
      <div id="players"></div>
    </div>
    <div class="sect">
      <h3>Actions</h3>
      <div id="actions"></div>
    </div>
    <div class="sect" id="logzone">
      <h3 class="loghead">
        <button id="logToggle" class="logtoggle" aria-expanded="true">
          <span class="chev">▾</span><span>Referee Log</span>
        </button>
        <span id="logcount"></span>
      </h3>
      <div id="log"></div>
    </div>
  </div>
</div>

<!-- ═══════════ overlays ═══════════ -->
<div class="overlay" id="modal" hidden><div class="sheet">
  <h2 id="mTitle">—</h2>
  <div class="sub" id="mSub"></div>
  <div class="plist" id="mList"></div>
  <div class="row" id="mRow"></div>
</div></div>

<div class="overlay" id="curtain" hidden><div class="sheet">
  <div class="sub" style="margin:0">Hands are hidden. Pass the device.</div>
  <div class="who" id="curtainWho">—</div>
  <div class="sub" id="curtainSub" style="margin-bottom:0"></div>
  <button class="ready" id="curtainGo">I'm ready — reveal my hand</button>
</div></div>

<div class="overlay" id="rules" hidden><div class="sheet">
  <h2>Rules Reference</h2>
  <div class="tabs" id="ruleTabs"></div>
  <div class="rulegrid" id="ruleBody"></div>
  <div class="row"><button class="bigbtn" id="rulesClose">Close</button></div>
</div></div>

<div id="toast"></div>

<!-- Classic scripts, in this order. They share one scope: each file reads
     the names the files before it declared. -->
<script src="engine.js"></script>
<script src="fx.js"></script>
<script src="ai.js"></script>
<script src="app.js"></script>
<script src="selftest.js"></script>
<script src="main.js"></script>
</body>
</html>
