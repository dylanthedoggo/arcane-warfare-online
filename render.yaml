services:
  - type: web
    name: checkers-arcane-warfare
    runtime: node
    plan: free
    # npm test runs the cheat-rejection suite. A broken referee fails the build
    # instead of shipping — worth the extra few seconds when the alternative is
    # discovering it mid-game.
    buildCommand: npm install && npm test
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "20"
